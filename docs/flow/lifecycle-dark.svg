<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 612" width="712" height="612" role="img">
<style>svg{--foreground:#f0f6fc;--muted-foreground:#9198a1;--card:#151b23;--border:#3d444d;--primary:#4493f8;--success:#3fb950;--warning:#d29922;--destructive:#f85149}

svg{--edge:color-mix(in srgb,var(--foreground) 38%,transparent);--mf:var(--muted-foreground,color-mix(in srgb,var(--foreground) 60%,transparent))}
.box{fill:var(--card);stroke:var(--border);stroke-width:1.25}
.proto .box{stroke-dasharray:4 3;stroke:color-mix(in srgb,var(--foreground) 32%,transparent)}

.t{fill:var(--foreground);font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;text-anchor:middle}
.s{fill:var(--mf);font:11px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;text-anchor:middle}
.tag{font:600 9.5px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;text-anchor:middle;letter-spacing:.04em}
.e{fill:none;stroke:var(--edge);stroke-width:1.5;stroke-dasharray:5 5;animation:march 1s linear infinite}
.e.del{stroke:color-mix(in srgb,var(--destructive) 70%,transparent)}
.e.soft{stroke-dasharray:2 4;animation-duration:1.6s}
.lb{fill:var(--mf);font:11px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.lb.m{text-anchor:middle}
.lb.e2{text-anchor:end}
.ah{fill:var(--edge)}
.ah.del{fill:color-mix(in srgb,var(--destructive) 70%,transparent)}
.fix .box{stroke:var(--success);stroke-width:1.75;fill:color-mix(in srgb,var(--success) 9%,var(--card))}
.park .box{stroke:var(--warning);stroke-width:1.75;fill:color-mix(in srgb,var(--warning) 9%,var(--card))}
.good .box{stroke:var(--mf);stroke-width:1.75}
.dia{fill:color-mix(in srgb,var(--primary) 12%,var(--card));stroke:var(--primary);stroke-width:1.5}
.hub .box{stroke:var(--primary);stroke-width:1.75}
.ring{fill:none;stroke:var(--primary);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite 1.2s}
.tok{filter:drop-shadow(0 0 4px currentColor)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes march{to{stroke-dashoffset:-10}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}

@media (prefers-reduced-motion:reduce){.e,.ring{animation:none}.tok{display:none}}
</style>
<defs><marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"></path></marker><marker id="lad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah del"></path></marker></defs><path d="M184,48 H274" class="e " marker-end="url(#la)"></path><text x="229" y="40" class="lb m">Add problem</text><path d="M436,48 H526" class="e  del" marker-end="url(#lad)"></path><text x="481" y="40" class="lb m">Remove</text><path d="M356,76 V128" class="e " marker-end="url(#la)"></path><text x="364" y="106" class="lb ">Judge →</text><path d="M356,186 V214" class="e " marker-end="url(#la)"></path><text x="364" y="204" class="lb ">all 4 answered</text><path d="M292,250 H150 V338" class="e " marker-end="url(#la)"></path><text x="220" y="243" class="lb m">Yes</text><path d="M356,284 V338" class="e " marker-end="url(#la)"></path><text x="364" y="318" class="lb ">Not now</text><path d="M420,250 H562 V338" class="e " marker-end="url(#la)"></path><text x="491" y="243" class="lb m">No, good enough</text><path d="M150,404 V512 H274" class="e " marker-end="url(#la)"></path><text x="158" y="452" class="lb ">all steps done</text><path d="M356,404 V482" class="e " marker-end="url(#la)"></path><text x="364" y="446" class="lb ">date passes · “It happened”</text><path d="M562,404 V512 H438" class="e " marker-end="url(#la)"></path><text x="570" y="452" class="lb ">Reopen (from detail)</text><path d="M356,540 V556 H24 V158 H274" class="e " marker-end="url(#la)"></path><text x="30" y="300" class="lb ">new verdict</text><g class="n "><rect x="24" y="20" width="160" height="56" rx="10" class="box"></rect><text x="104" y="45" class="t">Capture</text><text x="104" y="61" class="s">one sentence</text><g><rect x="128.8" y="12" width="49.2" height="16" rx="8" fill="color-mix(in srgb,var(--success) 18%,var(--card))" stroke="var(--success)" stroke-width="1"></rect><text x="153.4" y="23.5" class="tag" fill="var(--success)">IN APP</text></g></g><g class="n "><rect x="276" y="20" width="160" height="56" rx="10" class="box"></rect><text x="356" y="45" class="t">Inbox</text><text x="356" y="61" class="s">waiting for a verdict</text><g><rect x="380.8" y="12" width="49.2" height="16" rx="8" fill="color-mix(in srgb,var(--success) 18%,var(--card))" stroke="var(--success)" stroke-width="1"></rect><text x="405.4" y="23.5" class="tag" fill="var(--success)">IN APP</text></g></g><g class="n proto"><rect x="528" y="20" width="160" height="56" rx="10" class="box"></rect><text x="608" y="45" class="t">Removed</text><text x="608" y="61" class="s">no confirm, no undo</text></g><g class="n hub"><rect x="276" y="130" width="160" height="56" rx="10" class="box"></rect><text x="356" y="155" class="t">Judge</text><text x="356" y="171" class="s">closeness + 4 questions</text><rect x="276" y="130" width="160" height="56" rx="10" class="ring"></rect></g><g class="n"><polygon points="356,216 420,250 356,284 292,250" class="dia"></polygon><text x="356" y="254" class="t">Verdict</text></g><g class="n fix"><rect x="60" y="340" width="180" height="64" rx="10" class="box"></rect><text x="150" y="369" class="t">Fix now</text><text x="150" y="385" class="s">needs ≥ 1 step · why · effort</text></g><g class="n park"><rect x="266" y="340" width="180" height="64" rx="10" class="box"></rect><text x="356" y="369" class="t">Parked</text><text x="356" y="385" class="s">needs a date or condition</text></g><g class="n good"><rect x="472" y="340" width="180" height="64" rx="10" class="box"></rect><text x="562" y="369" class="t">Good enough</text><text x="562" y="385" class="s">reason · closed</text></g><g class="n hub"><rect x="276" y="484" width="160" height="56" rx="10" class="box"></rect><text x="356" y="509" class="t">Judge again</text><text x="356" y="525" class="s">answers prefilled</text></g><g class="n"><text x="580" y="282" class="lb" style="fill:var(--warning)">↺ Overrule: pick</text><text x="580" y="295" class="lb" style="fill:var(--warning)">another outcome,</text><text x="580" y="308" class="lb" style="fill:var(--warning)">recorded on card</text></g><circle r="5" fill="var(--success)" class="tok" style="color:var(--success)" opacity="0"><animateMotion dur="9s" begin="1s" repeatCount="indefinite" path="M104,48 H356 V250 H150 V372 V512 H356 V556 H24 V158 H356" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear"></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.94;1" dur="9s" begin="1s" repeatCount="indefinite"></animate></circle><circle r="5" fill="var(--warning)" class="tok" style="color:var(--warning)" opacity="0"><animateMotion dur="7.5s" begin="3.5s" repeatCount="indefinite" path="M356,48 V250 V372 V512 V556 H24 V158 H356" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear"></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.94;1" dur="7.5s" begin="3.5s" repeatCount="indefinite"></animate></circle><circle r="5" fill="var(--mf)" class="tok" style="color:var(--mf)" opacity="0"><animateMotion dur="9s" begin="6s" repeatCount="indefinite" path="M356,48 V250 H562 V372 V512 H356 V556 H24 V158 H356" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear"></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.94;1" dur="9s" begin="6s" repeatCount="indefinite"></animate></circle><g transform="translate(24 598)"><circle cx="4" cy="-4" r="4" style="fill:var(--success)"></circle><text x="14" y="0" class="lb" style="font-size:12px">fix-now route</text><circle cx="113.63270568847656" cy="-4" r="4" style="fill:var(--warning)"></circle><text x="123.63270568847656" y="0" class="lb" style="font-size:12px">parked route</text><circle cx="217.92290878295898" cy="-4" r="4" style="fill:var(--mf)"></circle><text x="227.92290878295898" y="0" class="lb" style="font-size:12px">good-enough route</text></g>
</svg>
